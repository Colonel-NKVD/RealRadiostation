name: Build RealRadiostation Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore RealRadiostation.csproj

    - name: Build
      run: msbuild RealRadiostation.csproj /p:Configuration=Release /p:TargetFramework=net48

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: RealRadiostation-Release
        # Исправленный путь с учетом папки конфигурации и фреймворка
        path: bin/Release/net48/RealRadiostation.dll
